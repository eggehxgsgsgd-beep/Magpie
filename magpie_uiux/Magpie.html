<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magpie — 图像分类工具</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body, #root { width:100%; height:100%; overflow:hidden; }
    body { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(128,128,128,0.25); border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover { background:rgba(128,128,128,0.4); }
    input, select, button, textarea { font-family:inherit; }
    input:focus, select:focus { outline:2px solid #22D3EE; outline-offset:-1px; }
    input[type="range"]:focus { outline:none; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
    @keyframes toastIn {
      from { opacity:0; transform:translateX(-50%) translateY(10px); }
      to { opacity:1; transform:translateX(-50%) translateY(0); }
    }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes scaleIn {
      from { opacity:0; transform:scale(0.96); }
      to { opacity:1; transform:scale(1); }
    }
    @keyframes imgIn {
      from { opacity:0; transform:scale(0.98); }
      to { opacity:1; transform:scale(1); }
    }
    @keyframes pulse {
      0%, 100% { opacity:1; }
      50% { opacity:0.4; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="magpie-icons.jsx"></script>
  <script type="text/babel" src="magpie-data.jsx"></script>
  <script type="text/babel" src="magpie-ui.jsx"></script>
  <script type="text/babel" src="magpie-settings.jsx"></script>
  <script type="text/babel" src="magpie-app.jsx"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "light",
      "layout": "classic",
      "badgeStyle": "corner"
    }/*EDITMODE-END*/;

    const { useTweaks, TweaksPanel, TweakSection, TweakRadio } = window;
    const { MagpieApp } = window;

    function Root() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      return (
        <React.Fragment>
          <MagpieApp tweaks={tweaks} />
          <TweaksPanel>
            <TweakSection label="外观" />
            <TweakRadio label="主题" value={tweaks.theme}
              options={[{value:'dark',label:'深色'},{value:'light',label:'浅色'}]}
              onChange={v => setTweak('theme', v)} />
            <TweakSection label="布局" />
            <TweakRadio label="分类面板" value={tweaks.layout}
              options={[{value:'classic',label:'右侧面板'},{value:'bottom',label:'底部栏'}]}
              onChange={v => setTweak('layout', v)} />
            <TweakSection label="分类标记" />
            <TweakRadio label="已分类标记" value={tweaks.badgeStyle}
              options={[{value:'corner',label:'角标'},{value:'tag',label:'色块标签'}]}
              onChange={v => setTweak('badgeStyle', v)} />
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
