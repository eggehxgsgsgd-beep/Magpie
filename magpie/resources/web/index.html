<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magpie — 图像分类工具</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body, #root { width:100%; height:100%; overflow:hidden; }
    body {
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      background:#18181B; color:#FAFAFA;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(128,128,128,0.25); border-radius:4px; }
    ::-webkit-scrollbar-thumb:hover { background:rgba(128,128,128,0.4); }
    input, select, button, textarea { font-family:inherit; }
    input:focus, select:focus { outline:2px solid #22D3EE; outline-offset:-1px; }
    input[type="range"]:focus { outline:none; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
    @keyframes toastIn {
      from { opacity:0; transform:translateX(-50%) translateY(10px); }
      to   { opacity:1; transform:translateX(-50%) translateY(0); }
    }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes scaleIn {
      from { opacity:0; transform:scale(0.96); }
      to   { opacity:1; transform:scale(1); }
    }
    @keyframes imgIn {
      from { opacity:0; transform:scale(0.98); }
      to   { opacity:1; transform:scale(1); }
    }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    #boot {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      font-size:13px; color:#71717A;
    }
  </style>
  <script src="vendor/qwebchannel.js"></script>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
  <script src="app/bridge.js"></script>
  <script type="text/babel" src="app/magpie-icons.jsx"></script>
  <script type="text/babel" src="app/magpie-data.jsx"></script>
  <script type="text/babel" src="app/magpie-ui.jsx"></script>
  <script type="text/babel" src="app/magpie-settings.jsx"></script>
  <script type="text/babel" src="app/magpie-app.jsx"></script>
</head>
<body>
  <div id="root"><div id="boot">Magpie 启动中…</div></div>
  <script type="text/babel" data-presets="env,react">
    (async () => {
      try {
        const api = await window.magpieReady;
        let initialPrefs = null, initialFolder = '';
        try {
          const init = await api.getInitialState();
          if (init) {
            initialPrefs = init.preferences || null;
            initialFolder = init.image_folder || '';
          }
        } catch (e) { console.error('getInitialState failed', e); }

        const root = document.getElementById('root');
        root.innerHTML = '';
        ReactDOM.createRoot(root).render(
          <MagpieApp api={api} initialPrefs={initialPrefs} initialFolder={initialFolder}/>
        );
      } catch (err) {
        document.getElementById('boot').textContent = '加载失败: ' + (err && err.message ? err.message : err);
        console.error(err);
      }
    })();
  </script>
</body>
</html>
