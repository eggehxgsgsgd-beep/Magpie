name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Derive version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          echo "MAGPIE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Magpie $VERSION (tag $TAG)"

      # --- Windows: installer + portable ---
      - name: Build installer (Windows)
        if: matrix.target == 'windows-x64'
        run: python packaging/build.py --target windows-x64 --installer
      - name: Build portable exe (Windows)
        if: matrix.target == 'windows-x64'
        run: python packaging/build.py --target windows-x64 --portable

      # --- Linux: .deb ---
      - name: Build .deb (Linux)
        if: matrix.target == 'linux-x86_64'
        run: python packaging/build.py --target linux-x86_64 --installer

      # --- macOS: onedir only (unchanged) ---
      - name: Build executable (macOS)
        if: startsWith(matrix.target, 'macos')
        run: python packaging/build.py --target ${{ matrix.target }}

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files
          # Windows: setup exe + portable exe
          cp dist/*-setup.exe release-files/ 2>/dev/null || true
          cp dist/*-portable.exe release-files/ 2>/dev/null || true
          # Linux: .deb
          cp dist/*.deb release-files/ 2>/dev/null || true
          # macOS: zip the onedir bundle
          if [[ "${{ matrix.target }}" == macos-* ]]; then
            cd dist
            zip -r ../release-files/Magpie-${MAGPIE_VERSION}-${{ matrix.target }}.zip Magpie-${MAGPIE_VERSION}-${{ matrix.target }}
            cd ..
          fi
          ls -lh release-files/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Magpie-${{ matrix.target }}
          path: release-files/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: List release files
        run: find release-artifacts -type f | sort
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
